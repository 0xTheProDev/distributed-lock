---
name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: 0xTheProDev/setup-js@v1
        with:
          cache: bun
          cache-version-file: .bun-version
          version-file: .nvmrc

      - name: Capture Target Version
        run: |
          if yarn changeset status --output=release.json; then
            echo "TARGET_VERSION=$(jq -r '.releases[] | select(.type != \"none\") | .newVersion' release.json)" >> "$GITHUB_ENV"
            rm release.json
          fi

      - name: Create Release Pull Request
        uses: changesets/action@v2
        with:
          pr-title: "ci(release): Release Package distributed-lock@v${{ env.TARGET_VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.changesets.outputs.has-changesets == 'false'
        run: yarn publish
